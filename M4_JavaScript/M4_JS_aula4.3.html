<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scripts/M4_JS_aula4.3.js"></script>
</head>
<body>
    <script>
        const a = "20";
        const b = a * 2; // b = 40 because the string "20" is coerced to a number during multiplication
        console.log(b); // Output: 40
        const c = a / 2; // c = 10 because the string "20" is coerced to a number during division
        console.log(c); // Output: 10
        const d = a - 2; // d = 18 because the string "20" is coerced to a number during subtraction
        console.log(d); // Output: 18
        const e = a + 2; // e = "202" because the string "20" is concatenated with the number 2
        console.log(e); // Output: "202"
    </script>
    <script>
        // Números
            let idade = 30;
            let pi = 3.14;
        // Strings
            let nome = "Samara";
            let frase = 'Olá, tudo bem?';
        // Boolean
            let estaAtivo = true;
            let temPermissao = false;
        // Null
            let valorNulo = null;
        // Undefined
            let salario; //(sem atribuição inicial)
    </script>
        <!-- Operadores Aritméticos
            Adição: + (exemplo: 5 + 3)
            Subtração: - (exemplo: 10 - 4)
            Multiplicação: * (exemplo: 5 * 3)
            Divisão: / (exemplo: 20 / 2)
            Modulo: % (exemplo: 10 % 3) - retorna o resto da divisão
            Incremento: ++ (exemplo: let x = 5; x++; // x agora é 6)
            Decremento: -- (exemplo: let y = 5; y--; // y agora é 4)
         -->
        <!-- Operadores Relacionais
            Igualdade: == (exemplo: 5 == '5') - true, compara apenas o valor
            Estritamente igual: === (exemplo: 5 === '5') - false, compara valor e tipo
            Diferente: != (exemplo: 5 != '5') - false, compara apenas o valor
            Estritamente diferente: !== (exemplo: 5 !== '5') - true, compara valor e tipo
            Maior que: > (exemplo: 10 > 5) - true
            Menor que: < (exemplo: 3 < 7) - true
            Maior ou igual a: >= (exemplo: 8 >= 8) - true
            Menor ou igual a: <= (exemplo: 4 <= 6) - true
        -->
        <!-- Operadores Lógicos
            E: && (exemplo: true && false) - false
            OU: || (exemplo: true || false) - true
            NOT: ! (exemplo: !true) - false
        -->

</body>
</html>
