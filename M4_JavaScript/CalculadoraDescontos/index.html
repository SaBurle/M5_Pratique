<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Descontos</title>
    <script src="calculadora.js"></script>
</head>
<body>
   <label for="valor">Valor Original do Produto:</label> 
   <input type="number" id="valor" placeholder="Digite o valor original do produto">
   <br><br>

   <label for="desconto">Desconto(%):</label> 
   <input type="number" id="desconto" placeholder="Digite o % de desconto">
   <br><br>

   <p id="resultado"></p>
   
   <button onclick="calcularDesconto()">Calcular Desconto</button>
  

   <script src="scripts.js"></script>
</body>
</html>
